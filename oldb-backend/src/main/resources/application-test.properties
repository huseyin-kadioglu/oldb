# Test / staging — schema: oldb_test (prod verisinden izole)
spring.config.activate.on-profile=test

security.jwt.secret-key=${JWT_SECRET:change-me-test-secret-key-at-least-32-chars}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}?currentSchema=oldb_test
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.jpa.properties.hibernate.default_schema=oldb_test

catalog.openlibrary.import-on-empty=${CATALOG_IMPORT_ON_EMPTY:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

management.metrics.export.dynatrace.enabled=false
management.health.mail.enabled=false
