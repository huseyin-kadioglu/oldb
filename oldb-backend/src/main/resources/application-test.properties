# Test ortamı — test branch deploy, oldb_test veritabanı (prod ile paylaşılmaz)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/oldb_test}
spring.datasource.username=${DATABASE_USER:myuser}
spring.datasource.password=${DATABASE_PASSWORD:mypassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.backend.url=${APP_BACKEND_URL:https://api-test.oldb.app}
app.frontend.url=${APP_FRONTEND_URL:https://test.oldb.app}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://test.oldb.app}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:OLDB Test <noreply@test.oldb.app>}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.daily-cap=${MAIL_DAILY_CAP:100}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.export.dynatrace.enabled=false
