spring.application.name=oldb

# Root docker-compose.yml ile Postgres zaten çalıştırılıyor; otomatik compose devre dışı
spring.docker.compose.enabled=false

# Local secrets overlay (gitignored). Missing file is OK (CI/prod).
spring.config.import=optional:classpath:application-local.properties

server.port=${PORT:8080}

# API hata gövdesinde kullanıcı mesajını göster (showcase limit vb.)
server.error.include-message=always

# --- Public URLs (override via env on deploy) ---
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:3000}
app.mail.from=${APP_MAIL_FROM:OLDB <noreply@localhost>}

# JWT — override with SECURITY_JWT_SECRET_KEY in prod / local overlay
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:change-me-dev-only-not-for-production}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_MS:3600000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.metrics.export.dynatrace.enabled=false

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Avatar dosya yükleme
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Open Library katalog import
catalog.openlibrary.import-on-empty=false
catalog.openlibrary.min-books=40
catalog.openlibrary.limit-per-query=50
