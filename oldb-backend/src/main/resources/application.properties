spring.application.name=oldb

# Default profile: local development (oldb_local schema)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Root docker-compose.yml ile Postgres zaten çalıştırılıyor; otomatik compose devre dışı
spring.docker.compose.enabled=false

# API hata gövdesinde kullanıcı mesajını göster (showcase limit vb.)
server.error.include-message=always

security.jwt.expiration-time=3600000

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

management.endpoints.web.exposure.include=*

# Avatar dosya yükleme
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Open Library katalog import (boş / yetersiz DB)
catalog.openlibrary.min-books=40
catalog.openlibrary.limit-per-query=50
