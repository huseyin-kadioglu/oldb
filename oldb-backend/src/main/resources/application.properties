spring.application.name=oldb

# Varsayılan: yerel geliştirme profili (test/prod için -Dspring.profiles.active=test|prod)
spring.profiles.active=local

# Root docker-compose.yml ile Postgres zaten çalıştırılıyor; otomatik compose devre dışı
spring.docker.compose.enabled=false

# API hata gövdesinde kullanıcı mesajını göster (showcase limit vb.)
server.error.include-message=always

# JWT — gerçek değerler profile dosyası veya ortam değişkeni ile verilir
security.jwt.secret-key=${JWT_SECRET_KEY:}
security.jwt.expiration-time=3600000

# Veritabanı — her ortam kendi DB adını kullanır (oldb_local / oldb_test / oldb_prod)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/oldb_local}
spring.datasource.username=${DATABASE_USER:myuser}
spring.datasource.password=${DATABASE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Ortam URL'leri (CORS, aktivasyon maili, yönlendirme)
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Mail — ortam profili ile yapılandırılır (local: Mailpit, test/prod: SMTP)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:OLDB <noreply@localhost>}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.daily-cap=${MAIL_DAILY_CAP:0}

# Avatar dosya yükleme
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Actuator — prod profili daha kısıtlı exposure kullanır
management.endpoints.web.exposure.include=health,info

# Open Library katalog import (boş / yetersiz DB)
catalog.openlibrary.import-on-empty=false
catalog.openlibrary.min-books=40
catalog.openlibrary.limit-per-query=50
