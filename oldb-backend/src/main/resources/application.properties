spring.application.name=oldb

# Default developer profile. Override: -Dspring.profiles.active=test|prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.docker.compose.enabled=false

server.error.include-message=always

# Secrets come from the active profile file or environment. Never commit real values.
security.jwt.secret-key=${JWT_SECRET_KEY:}
# Session token (Beni hatırla kapalı): 12 saat. Remember-me: 30 gün.
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:43200000}
security.jwt.remember-me-expiration-time=${JWT_REMEMBER_ME_EXPIRATION_TIME:2592000000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/oldb_local}
spring.datasource.username=${DATABASE_USER:myuser}
spring.datasource.password=${DATABASE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

app.backend.url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:OLDB <noreply@localhost>}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.daily-cap=${MAIL_DAILY_CAP:0}

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.metrics.export.dynatrace.enabled=false

catalog.openlibrary.import-on-empty=false
catalog.openlibrary.min-books=40
catalog.openlibrary.limit-per-query=50
