# Production. All secrets must come from the environment. ddl-auto is validate only.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

security.jwt.secret-key=${JWT_SECRET_KEY}

app.backend.url=${APP_BACKEND_URL}
app.frontend.url=${APP_FRONTEND_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.daily-cap=${MAIL_DAILY_CAP:500}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.export.dynatrace.enabled=false
server.error.include-message=never

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
