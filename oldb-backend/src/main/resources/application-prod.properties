# Production — schema: oldb_prod
# Credentials must come from environment (never commit secrets here).
spring.config.activate.on-profile=prod

security.jwt.secret-key=${JWT_SECRET}

# Prefer full JDBC URL if provided (Railway etc.), else host/user/password pieces.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=oldb_prod}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.default_schema=oldb_prod
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

catalog.openlibrary.import-on-empty=false

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

management.metrics.export.dynatrace.enabled=${DYNATRACE_ENABLED:false}
management.metrics.export.dynatrace.uri=${DYNATRACE_URI:}
management.metrics.export.dynatrace.api-token=${DYNATRACE_API_TOKEN:}
management.metrics.export.dynatrace.step=30s
management.metrics.export.dynatrace.prefix=${DYNATRACE_PREFIX:oldb}
