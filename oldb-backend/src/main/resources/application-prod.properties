# Active with: SPRING_PROFILES_ACTIVE=prod
# Do not put secrets here — set them as platform env vars.

server.error.include-message=never

spring.jpa.hibernate.ddl-auto=update
# TODO Faz 3: Flyway + ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.export.dynatrace.enabled=false

# Require explicit URLs in production
# APP_BACKEND_URL, APP_FRONTEND_URL, APP_CORS_ORIGINS
# SECURITY_JWT_SECRET_KEY
# SPRING_DATASOURCE_URL / USERNAME / PASSWORD
# SPRING_MAIL_* and APP_MAIL_FROM
