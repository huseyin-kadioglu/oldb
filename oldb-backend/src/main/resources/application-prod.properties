# Active with: SPRING_PROFILES_ACTIVE=prod
# Do not put secrets here — set them as platform env vars.

server.error.include-message=never

spring.jpa.hibernate.ddl-auto=update
# TODO Faz 3: Flyway + ddl-auto=validate

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.metrics.export.dynatrace.enabled=false

server.address=0.0.0.0

# Prefer explicit JDBC vars from Railway (see RAILWAY.md)
# spring.datasource.* is set by DatabaseUrlEnvironmentPostProcessor when DATABASE_URL is present
