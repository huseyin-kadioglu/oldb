# Prod ortamı — prod branch deploy, oldb_prod veritabanı (test ile paylaşılmaz)
# DATABASE_URL zorunlu — örnek: jdbc:postgresql://host:5432/oldb_prod
spring.datasource.url=${DATABASE_URL}
spring.jpa.hibernate.ddl-auto=validate

app.backend.url=${APP_BACKEND_URL:https://api.oldb.app}
app.frontend.url=${APP_FRONTEND_URL:https://oldb.app}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://oldb.app}

app.mail.enabled=${MAIL_ENABLED:true}

# Prod güvenlik
management.endpoints.web.exposure.include=health
management.metrics.export.dynatrace.enabled=false
