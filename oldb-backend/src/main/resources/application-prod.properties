# Active with: SPRING_PROFILES_ACTIVE=prod
# Do not put secrets here — set them as platform env vars.

server.error.include-message=never

spring.jpa.hibernate.ddl-auto=update
# TODO Faz 3: Flyway + ddl-auto=validate

# Fail loudly if DB still points at local defaults (misconfigured Railway vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:1/misconfigured}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:misconfigured}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:misconfigured}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.metrics.export.dynatrace.enabled=false

server.address=0.0.0.0
